<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>小豆邀请码雷达</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="title"><span class="pulse"></span><h1>小豆邀请码雷达</h1></div>
  <p class="sub" id="meta">正在加载…</p>
  <div class="stats" id="stats"></div>
</header>

<nav class="toolbar">
  <div class="seg" id="seg">
    <button data-v="10" class="on">10 分钟内</button>
    <button data-v="60">1 小时内</button>
    <button data-v="1440">24 小时内</button>
    <button data-v="0">全部</button>
  </div>
  <div class="filters">
    <select id="plat"><option value="">全部平台</option></select>
    <select id="sort">
      <option value="time">按时间</option>
      <option value="chance">按可用可能性</option>
    </select>
    <label class="sw"><input type="checkbox" id="hideBad" checked><span></span>隐藏大概率失效</label>
  </div>
</nav>

<main id="list"></main>
<p class="empty" id="empty" hidden></p>

<footer>
  每几分钟自动查询一次，页面每 30 秒自动更新。<br>
  用了某个码发现失效？点卡片上的「失效了」帮大家标一下，可用就点「能用」。<br>
  码能不能用以小豆 App 验证为准，请勿付费购买邀请码。
</footer>

<div class="toast" id="toast"></div>

<template id="card">
  <article class="card">
    <div class="row1">
      <span class="code"></span>
      <span class="chance"></span>
    </div>
    <div class="chips"></div>
    <dl class="times"></dl>
    <div class="actions">
      <button class="btn primary copy">复制</button>
      <a class="btn tint go" target="_blank" rel="noopener noreferrer">去兑换</a>
      <span class="spacer"></span>
      <button class="btn ghost ok">能用 <b>0</b></button>
      <button class="btn ghost bad">失效了 <b>0</b></button>
    </div>
  </article>
</template>
<script src="app.js"></script>
</body>
</html>
