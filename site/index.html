<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小豆邀请码 · 全网社交雷达</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>小豆邀请码 · 全网社交雷达</div>
  <div class="meta" id="meta">正在加载…</div>
</header>
<section class="bar">
  <label><input type="checkbox" id="fresh" checked> 只看 10 分钟内鲜码</label>
  <label><input type="checkbox" id="hideUsed" checked> 隐藏疑似已领/售卖</label>
  <label><input type="checkbox" id="hideAgg"> 隐藏抓码聚合站</label>
  <select id="src"><option value="">全部平台</option></select>
  <button id="reload">立即刷新</button>
</section>
<section id="sources" class="sources"></section>
<main id="list"></main>
<p class="empty" id="empty" hidden>当前筛选条件下暂无新码（“只看 10 分钟内鲜码”只算能确定发布时间的码）。雷达每几分钟自动扫一次，页面每 30 秒自动拉取。可以先取消“只看 10 分钟内鲜码”看看最近的码。</p>
<footer>
  数据只来自公开帖子和评论，不登录、不发帖、不代领。码能不能用以小豆 App 验证为准，请勿付费买码。
  <br>数据地址：<code id="dataUrl"></code>（可在网址后加 <code>?data=你的 codes.json 地址</code> 切换数据源）
</footer>
<template id="card">
  <article class="card">
    <div class="top">
      <span class="code"></span>
      <button class="copy">复制</button>
      <a class="go" target="_blank" rel="noopener">打开邀请链接</a>
    </div>
    <div class="tags"></div>
    <div class="times"></div>
    <p class="snippet"></p>
    <div class="foot"><a class="origin" target="_blank" rel="noopener">查看出处</a><span class="where"></span></div>
  </article>
</template>
<script src="app.js"></script>
</body>
</html>
